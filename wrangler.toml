main = "src/telegram/telegramWebhook.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_als"]

[observability]
enabled = true

[env.dev]
name = "noted-it-dev-bot"
[env.dev.vars]
APP_VERSION = "0.2.0-dev-local"
[[env.dev.kv_namespaces]]
binding = "I18N"
id = "e0e7f8d9713349c5ae59be6961935109"
remote = true
[[env.dev.kv_namespaces]]
binding = "MESSAGE_LOG"
id = "f1a94b61a6ea499ba534adab79d3b3fc"
remote = true
[[env.dev.d1_databases]]
binding = "USAGE_DB"
database_name = "noted-it-dev-usage"
database_id = "79df708c-b243-45ba-b308-f2d25f03db4a"
remote = true

[env.prod]
name = "noted-it-bot"
[env.prod.vars]
APP_VERSION = "0.2.0-dev-local"
[[env.prod.kv_namespaces]]
binding = "I18N"
id = "296e4c6114df451ca33774a2edf28ce5"
[[env.prod.kv_namespaces]]
binding = "MESSAGE_LOG"
id = "0995f983386447d89941d1a4de8ac90b"
[[env.prod.d1_databases]]
binding = "USAGE_DB"
database_name = "noted-it-prod-usage"
database_id = "00000000-0000-0000-0000-000000000000"
