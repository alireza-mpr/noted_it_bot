main = "src/app/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_als"]

# Keeps wrangler's default Text rules (.txt, .html) and adds .css for the time zone page.
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

[observability]
enabled = true

# One Worker per bot edition (ADR-10). The editions of a stage share its D1
# database, because Gemini counts usage per Google project, not per bot. To
# separate an edition later, give it its own database here, and its own keys
# in its GitHub Environment: no code changes.

[env.dev]
name = "noted-it-dev-bot"
[env.dev.vars]
APP_VERSION = "1.0.0-dev-local"
BOT_EDITION = "english"
[[env.dev.d1_databases]]
binding = "USAGE_DB"
database_name = "noted-it-dev-usage"
database_id = "79df708c-b243-45ba-b308-f2d25f03db4a"
remote = true

[env.dev-fa]
name = "noted-it-dev-fa-bot"
[env.dev-fa.vars]
APP_VERSION = "1.0.0-dev-local"
BOT_EDITION = "persian"
[[env.dev-fa.d1_databases]]
binding = "USAGE_DB"
database_name = "noted-it-dev-usage"
database_id = "79df708c-b243-45ba-b308-f2d25f03db4a"
remote = true

[env.prod]
name = "prod"
[env.prod.vars]
APP_VERSION = "1.0.0-dev-local"
BOT_EDITION = "english"
[[env.prod.d1_databases]]
binding = "USAGE_DB"
database_name = "noted-it-prod-usage"
database_id = "893a4cd0-93a9-4599-bcf5-70a259a812d2"

[env.prod-fa]
name = "prod-fa"
[env.prod-fa.vars]
APP_VERSION = "1.0.0-dev-local"
BOT_EDITION = "persian"
[[env.prod-fa.d1_databases]]
binding = "USAGE_DB"
database_name = "noted-it-prod-usage"
database_id = "893a4cd0-93a9-4599-bcf5-70a259a812d2"
