main = "src/index.ts"
compatibility_date = "2026-09-01"

[env.dev]
name = "noted-it-dev-bot"
[env.dev.vars]
APP_VERSION = "0.0.0-dev-local"
[[env.dev.kv_namespaces]]
binding = "I18N"
id = "e0e7f8d9713349c5ae59be6961935109"
[[env.dev.kv_namespaces]]
binding = "USER_LANG"
id = "d05a28ba60ae461e935926195327875d"
[[env.dev.kv_namespaces]]
binding = "MESSAGE_LOG"
id = "f1a94b61a6ea499ba534adab79d3b3fc"
[[env.dev.kv_namespaces]]
binding = "WHITELIST"
id = "6b921bb296ca46bf95c7340852fabc67"

[env.prod]
name = "noted-it-bot"
[env.prod.vars]
APP_VERSION = "0.0.0-dev-local"
[[env.prod.kv_namespaces]]
binding = "I18N"
id = "REPLACE_WITH_PROD_I18N_KV_ID" # `npx wrangler kv namespace create I18N --env prod`
[[env.prod.kv_namespaces]]
binding = "USER_LANG"
id = "REPLACE_WITH_PROD_USER_LANG_KV_ID" # `npx wrangler kv namespace create USER_LANG --env prod`
[[env.prod.kv_namespaces]]
binding = "MESSAGE_LOG"
id = "REPLACE_WITH_PROD_MESSAGE_LOG_KV_ID" # `npx wrangler kv namespace create MESSAGE_LOG --env prod`
[[env.prod.kv_namespaces]]
binding = "WHITELIST"
id = "REPLACE_WITH_PROD_WHITELIST_KV_ID" # `npx wrangler kv namespace create WHITELIST --env prod`
