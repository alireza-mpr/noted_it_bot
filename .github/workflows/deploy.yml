name: Deploy

on:
  # Prod is never triggered automatically by a tag push — GitHub's native
  # "Required reviewers" approval gate isn't available on private repos on
  # the Free plan, so deliberate manual triggering (picking the tag from the
  # ref dropdown here, then clicking Run) is the guard instead.
  # Dev deploys live in ci.yml, after the tests pass.
  workflow_dispatch:

jobs:
  # Ships each bot edition to prod (ADR-10). A wrong secret fails its
  # edition's job at the step that uses it, with Telegram's or Cloudflare's
  # error in the log; the other edition still deploys.
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: english
            environment: prod
          - edition: persian
            environment: prod-fa
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        id: version
        # Prod's version is the tag itself (e.g. v1.0.0 -> 1.0.0), not the
        # run-number scheme dev uses — /ver should say exactly what you
        # deployed, since that's literally how you chose what to deploy.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ matrix.environment }} --var APP_VERSION:${{ steps.version.outputs.version }}
          environment: ${{ matrix.environment }}
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
            GEMINI_API_KEY
            GROQ_API_KEY
            AXIOM_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}

      - name: Point the Telegram webhook at the Worker
        run: |
          curl -sS --fail-with-body "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -d "url=${WORKER_URL}" \
            -d "secret_token=${WEBHOOK_SECRET}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Register the edition's / menu with Telegram
        run: |
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setMyCommands" \
            -H "Content-Type: application/json" \
            -d @.github/bot-menus/${{ matrix.edition }}.json
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      # Telegram rate-limits these calls (setMyName especially), so each one
      # is only made when the text in the file differs from the bot's.
      - name: Set the edition's name and descriptions
        run: |
          set -o pipefail
          profile=.github/bot-profiles/${{ matrix.edition }}.json
          api="https://api.telegram.org/bot${BOT_TOKEN}"
          set_if_changed() {
            current=$(curl -sS --fail-with-body "${api}/$1" | jq -r ".result.$3")
            wanted=$(jq -r ".$3" "$profile")
            if [ "$current" != "$wanted" ]; then
              curl -sS --fail-with-body -X POST "${api}/$2" -H "Content-Type: application/json" \
                -d "$(jq -c "{$3}" "$profile")"
            fi
          }
          set_if_changed getMyName setMyName name
          set_if_changed getMyDescription setMyDescription description
          set_if_changed getMyShortDescription setMyShortDescription short_description
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
