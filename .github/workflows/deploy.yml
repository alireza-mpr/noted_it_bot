name: Deploy

on:
  # Prod is never triggered automatically by a tag push — GitHub's native
  # "Required reviewers" approval gate isn't available on private repos on
  # the Free plan, so deliberate manual triggering (picking the tag from the
  # ref dropdown here, then clicking Run) is the guard instead.
  # Dev deploys live in ci.yml, after the tests pass.
  workflow_dispatch:

jobs:
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        id: version
        # Prod's version is the tag itself (e.g. v0.2.0 -> 0.2.0), not the
        # beta/run-number scheme dev uses — /ver should say exactly what you
        # deployed, since that's literally how you chose what to deploy.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers (prod)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env prod --var APP_VERSION:${{ steps.version.outputs.version }}
          environment: prod
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
            GEMINI_API_KEY
            GROQ_API_KEY
            AXIOM_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}

      - name: Point the Telegram webhook at the Worker
        run: |
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -d "url=${WORKER_URL}" \
            -d "secret_token=${WEBHOOK_SECRET}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Register bot commands for Telegram's autocomplete menu
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setMyCommands" \
            -H "Content-Type: application/json" \
            -d '{"commands":[
              {"command":"start","description":"What this bot does"},
              {"command":"lang","description":"Set or check your reply language"},
              {"command":"ver","description":"Show the running version"}
            ]}'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
