name: Deploy

on:
  # Prod is never triggered automatically by a tag push — GitHub's native
  # "Required reviewers" approval gate isn't available on private repos on
  # the Free plan, so deliberate manual triggering (picking the tag from the
  # ref dropdown here, then clicking Run) is the guard instead.
  # Dev deploys live in ci.yml, after the tests pass.
  workflow_dispatch:

jobs:
  # Ships each bot edition to prod (ADR-10). An edition whose GitHub
  # Environment has no BOT_TOKEN yet is skipped with a notice, not failed.
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: english
            environment: prod
          - edition: persian
            environment: prod-fa
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - name: Check the edition is set up
        id: setup
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No BOT_TOKEN in the ${{ matrix.environment }} environment: the ${{ matrix.edition }} edition is not deployed."
          fi
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.setup.outputs.ready == 'true'
        run: npm ci

      - name: Compute version
        if: steps.setup.outputs.ready == 'true'
        id: version
        # Prod's version is the tag itself (e.g. v1.0.0 -> 1.0.0), not the
        # run-number scheme dev uses — /ver should say exactly what you
        # deployed, since that's literally how you chose what to deploy.
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: steps.setup.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ matrix.environment }} --var APP_VERSION:${{ steps.version.outputs.version }}
          environment: ${{ matrix.environment }}
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
            GEMINI_API_KEY
            GROQ_API_KEY
            AXIOM_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}

      - name: Point the Telegram webhook at the Worker
        if: steps.setup.outputs.ready == 'true'
        run: |
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -d "url=${WORKER_URL}" \
            -d "secret_token=${WEBHOOK_SECRET}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Register the edition's / menu with Telegram
        if: steps.setup.outputs.ready == 'true'
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setMyCommands" \
            -H "Content-Type: application/json" \
            -d @.github/bot-menus/${{ matrix.edition }}.json
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
