name: CI

on:
  push:
  pull_request:
  # Manual run from the Actions tab (pick main). Tick "skip" to build and
  # deploy without the integration tests, e.g. when the dev Gemini quota is used up.
  workflow_dispatch:
    inputs:
      skip_integration_tests:
        description: Skip the integration tests
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The test setup needs these keys even when no model is called.
      - name: Offline tests
        run: npx vitest run tests/unit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Integration tests
        if: ${{ !inputs.skip_integration_tests }}
        run: npx vitest run tests/integration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Ships each bot edition to dev when the job above passed (ADR-10). Only
  # main deploys; PRs and other branches never do. A wrong secret fails its
  # edition's job at the step that uses it, with Telegram's or Cloudflare's
  # error in the log; the other edition still deploys.
  deploy-dev:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: english
            environment: dev
          - edition: persian
            environment: dev-fa
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        id: version
        run: echo "version=1.0.${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ matrix.environment }} --var APP_VERSION:${{ steps.version.outputs.version }}
          environment: ${{ matrix.environment }}
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
            GEMINI_API_KEY
            GROQ_API_KEY
            AXIOM_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}

      - name: Point the Telegram webhook at the Worker
        run: |
          curl -sS --fail-with-body "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -d "url=${WORKER_URL}" \
            -d "secret_token=${WEBHOOK_SECRET}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Register the edition's / menu with Telegram
        run: |
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setMyCommands" \
            -H "Content-Type: application/json" \
            -d @.github/bot-menus/${{ matrix.edition }}.json
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      # Telegram rate-limits these calls (setMyName especially), so each one
      # is only made when the text in the file differs from the bot's.
      - name: Set the edition's name and descriptions
        run: |
          set -o pipefail
          # The profile holds the prod name; a dev bot's name ends in " - Dev".
          profile=$(mktemp)
          jq '.name += " - Dev"' .github/bot-profiles/${{ matrix.edition }}.json > "$profile"
          api="https://api.telegram.org/bot${BOT_TOKEN}"
          set_if_changed() {
            current=$(curl -sS --fail-with-body "${api}/$1" | jq -r ".result.$3")
            wanted=$(jq -r ".$3" "$profile")
            if [ "$current" != "$wanted" ]; then
              curl -sS --fail-with-body -X POST "${api}/$2" -H "Content-Type: application/json" \
                -d "$(jq -c "{$3}" "$profile")"
            fi
          }
          set_if_changed getMyName setMyName name
          set_if_changed getMyDescription setMyDescription description
          set_if_changed getMyShortDescription setMyShortDescription short_description
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  # Tags this dev deploy with the same string /ver reports, so it can be found
  # later with `git tag`. Runs once, only after every edition deployed: a
  # failed deploy leaves no tag.
  tag-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag this dev deploy
        run: |
          version="1.0.${{ github.run_number }}-$(git rev-parse --short HEAD)"
          git tag "v${version}"
          git push origin "v${version}"
