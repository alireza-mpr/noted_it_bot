name: CI

on:
  push:
  pull_request:
  # Manual run from the Actions tab (pick main). Tick "force" to deploy to dev
  # even if the tests fail, e.g. when they fail only because the dev Gemini
  # quota is used up.
  workflow_dispatch:
    inputs:
      force_deploy_dev:
        description: Deploy to dev even if the tests fail
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Ships to dev when the CI job above passed, or when a manual run ticks
  # force_deploy_dev. Only main deploys; PRs and other branches never do.
  deploy-dev:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.force_deploy_dev))
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write # needed to push the per-deploy tag below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute version
        id: version
        run: echo "version=0.2.${{ github.run_number }}-beta-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers (dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env dev --var APP_VERSION:${{ steps.version.outputs.version }}
          environment: dev
          secrets: |
            BOT_TOKEN
            WEBHOOK_SECRET
            GEMINI_API_KEY
            GROQ_API_KEY
            AXIOM_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}

      - name: Point the Telegram webhook at the Worker
        run: |
          curl -sf "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            -d "url=${WORKER_URL}" \
            -d "secret_token=${WEBHOOK_SECRET}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_URL: ${{ secrets.WORKER_URL }}

      - name: Register bot commands for Telegram's autocomplete menu
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setMyCommands" \
            -H "Content-Type: application/json" \
            -d '{"commands":[
              {"command":"start","description":"Start here, with an example to try"},
              {"command":"help","description":"How I work, and what you can set"},
              {"command":"lang","description":"Set or check your reply language"},
              {"command":"tz","description":"Set your time zone, e.g. /tz Melbourne"},
              {"command":"ver","description":"Show the running version"}
            ]}'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

      # Tags this exact dev deploy with the same string /ver reports, so a
      # specific dev deployment can be found later via `git tag`. Only runs
      # after a successful deploy — a failed deploy leaves no tag.
      - name: Tag this dev deploy
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
